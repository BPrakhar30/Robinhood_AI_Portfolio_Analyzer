# Production Docker Compose
#
# Usage:  docker compose -f docker-compose.prod.yml up -d --build
#
# Differences from docker-compose.yml (dev):
#   - No source-code bind mounts (code is baked into the image)
#   - No hot-reload (uvicorn without --reload, no watchfiles on MCP)
#   - Postgres port NOT exposed to host (internal Docker network only)
#   - Backend runs with 2 uvicorn workers
#   - Frontend runs a production build (next build + next start)
#   - Caddy handles HTTPS (Let's Encrypt) and reverse-proxies both services
#   - NEXT_PUBLIC_API_URL baked into the frontend image at build time

services:
  postgres:
    image: postgres:16-alpine
    container_name: robinhood-postgres
    restart: unless-stopped
    # No ports:  -  Postgres is reachable only within the Docker network
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: robinhood_ai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: robinhood-backend
    restart: unless-stopped
    # No ports:  -  backend is only reachable through Caddy
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - DEBUG=false
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/robinhood_ai
      - DATABASE_URL_SYNC=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/robinhood_ai
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy
      mcp-server:
        condition: service_started
      otel-collector:
        condition: service_started
    # 2 workers for production; --proxy-headers trusts Caddy's X-Forwarded-* headers
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers --forwarded-allow-ips=*

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: robinhood-mcp-server
    restart: unless-stopped
    # Internal-only: no ports exposed
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/robinhood_ai
      - DATABASE_URL_SYNC=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/robinhood_ai
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8765
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    # No watchfiles in production  -  just run directly
    command: python -m app.mcp_server

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        # Baked into the Next.js client bundle at build time.
        # Must match the domain Caddy serves (e.g. https://yourdomain.com)
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: robinhood-frontend
    restart: unless-stopped
    # No ports:  -  frontend is only reachable through Caddy
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    container_name: robinhood-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN}
    depends_on:
      - frontend
      - backend

  # ── Observability (self-hosted OTel + Grafana stack) ──────────────────────
  # The app exports telemetry to otel-collector via OTEL_EXPORTER_OTLP_ENDPOINT.
  # These are all internal-only (no host ports) except Grafana, which binds to
  # localhost so you reach it over an SSH tunnel:
  #   ssh -L 3000:localhost:3000 user@server  ->  http://localhost:3000

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.153.0
    container_name: robinhood-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - tempo
      - loki
      - prometheus

  tempo:
    image: grafana/tempo:2.9.1
    container_name: robinhood-tempo
    restart: unless-stopped
    user: "0:0"
    command: ["-config.file=/etc/tempo/tempo-config.yaml"]
    volumes:
      - ./observability/tempo-config.yaml:/etc/tempo/tempo-config.yaml:ro
      - tempo-data:/var/tempo

  loki:
    image: grafana/loki:3.7.2
    container_name: robinhood-loki
    restart: unless-stopped
    user: "0:0"
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki

  prometheus:
    image: prom/prometheus:v3.5.3
    container_name: robinhood-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:12.4.3
    container_name: robinhood-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - tempo
      - loki
      - prometheus

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  tempo-data:
  loki-data:
  prometheus-data:
  grafana-data:
