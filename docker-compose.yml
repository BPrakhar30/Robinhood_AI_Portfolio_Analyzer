services:
  postgres:
    image: postgres:16-alpine
    container_name: robinhood-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: robinhood_ai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: robinhood-backend
    ports:
      - "8000:8000"
    volumes:
      - ./app:/workspace/app
      - ./tests:/workspace/tests
      - ./scripts:/workspace/scripts
      - ./requirements.txt:/workspace/requirements.txt:ro
      - ./.env.example:/workspace/.env.example:ro
    env_file:
      - .env
    environment:
      - APP_ENV=development
      - DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/robinhood_ai
      - DATABASE_URL_SYNC=postgresql://postgres:postgres@postgres:5432/robinhood_ai
      - WATCHFILES_FORCE_POLLING=true
    depends_on:
      postgres:
        condition: service_healthy
      mcp-server:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: robinhood-mcp-server
    # Internal-only: no `ports:` stanza on purpose.
    volumes:
      - ./app:/workspace/app
      - ./requirements.txt:/workspace/requirements.txt:ro
    env_file:
      - .env
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/robinhood_ai
      - DATABASE_URL_SYNC=postgresql://postgres:postgres@postgres:5432/robinhood_ai
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8765
      - WATCHFILES_FORCE_POLLING=true
    depends_on:
      postgres:
        condition: service_healthy
    # watchfiles restarts the FastMCP process on .py edits under ./app.
    command: watchfiles --filter python "python -m app.mcp_server" /workspace/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: robinhood-frontend
    ports:
      - "3000:3000"
    # Source is bind-mounted; node_modules and .next use named volumes to
    # isolate from host (platform mismatches on Windows) and persist across
    # ``docker compose down``. Add npm packages without rebuilding via:
    #   docker compose exec frontend npm install <pkg>
    volumes:
      - ./frontend:/workspace
      - frontend_node_modules:/workspace/node_modules
      - frontend_next_cache:/workspace/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    command: npx next dev --port 3000 --hostname 0.0.0.0

volumes:
  pgdata:
  frontend_node_modules:
  frontend_next_cache:
